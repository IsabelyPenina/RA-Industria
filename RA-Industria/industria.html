<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RA - Maquete da Indústria</title>

<link rel="stylesheet" href="style.css">

<!-- A-Frame -->
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

<!-- MindAR -->
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

</head>

<body>

<!-- Painel superior -->

<div id="painel">

<h2>Realidade Aumentada</h2>

<p id="status">

📷 Procurando a maquete...

</p>

</div>


<!-- Barra inferior -->

<div id="menu">

<button id="btnPlanta" disabled>

📐 Planta

</button>

<button id="btnAA" disabled>

✂ Corte AA

</button>

<button id="btnBB" disabled>

✂ Corte BB

</button>

</div>



<a-scene

mindar-image="

imageTargetSrc: assets/industria.mind;

autoStart: true;

uiScanning: true;

uiLoading: yes;

uiError: yes;

"

color-space="sRGB"

renderer="colorManagement:true"

vr-mode-ui="enabled:false"

device-orientation-permission-ui="enabled:true"

embedded>



<a-assets>

<img id="planta"

src="assets/planta.png">

<img id="corteAA"

src="assets/corteAA.png">

<img id="corteBB"

src="assets/corteBB.png">

</a-assets>



<a-camera

position="0 0 0"

look-controls="enabled:false">

</a-camera>



<a-entity mindar-image-target="targetIndex:0">



<a-plane

id="imagemRA"

src="#planta"

position="0 0 0"

width="1.5"

height="1"

transparent="true">

</a-plane>



</a-entity>



</a-scene>



<script src="script.js"></script>

</body>

</html>
