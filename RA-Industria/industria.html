<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="utf-8">

<title>Maquete da Indústria</title>

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

<style>

body{

margin:0;

overflow:hidden;

}

#painel{

position:fixed;

top:20px;

left:50%;

transform:translateX(-50%);

background:white;

padding:10px 20px;

border-radius:10px;

z-index:999;

font-family:Arial;

}

</style>

</head>

<body>

<div id="painel">

Aponte a câmera para o marcador

</div>

<a-scene

embedded

vr-mode-ui="enabled:false"

arjs="sourceType: webcam;">

<a-marker preset="hiro">

<a-box

position="0 0.5 0"

color="#1976D2">

</a-box>

</a-marker>

<a-entity camera></a-entity>

</a-scene>

</body>

</html>
